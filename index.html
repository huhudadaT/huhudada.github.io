<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css" />
    <script defer src="https://pyscript.net/alpha/pyscript.js"></script>
    <title>huhudada</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 200vh;
            overflow-x: hidden;
        }
        .background {
            background-image: url("000001.jpg");
            background-size: cover;
            background-position: 50% 50%;
            height: 200vh;
            font: 900 55vw '';
            line-height: 130vh;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent ;
            position: relative;
            text-align: center;
            overflow: hidden;
        }
        .background::before {
            content: '';
            background-size: cover;
            background-image: inherit;
            background-position: 50% 50%;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: -99;
        }
        h1 {
            position: absolute;
            text-align: center;
            width: 100%;
            letter-spacing: 10px;
            color: #fff;
        }
        h2 {
            position: absolute;
            letter-spacing: 2px;
            top: 120vh;
            width: 60%;
            color: #fff;
            left: 50%;
            transform: translateX(-50%);
            padding: 30px;
            background-color: rgba(0, 0, 0, .3);
            margin-top: 100px;
        }
        .nav-menu {
            position: fixed;
            top: 24px;
            left: 32px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-family: monospace;
        }
        .nav-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 26px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }
        .nav-toggle:hover,
        .nav-toggle:focus-visible {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            outline: none;
        }
        .nav-caret {
            display: inline-block;
            transition: transform 0.3s;
        }
        .nav-toggle[aria-expanded="true"] .nav-caret {
            transform: rotate(180deg);
        }
        .nav-dropdown {
            display: none;
            flex-direction: column;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .nav-dropdown.open {
            display: flex;
        }
        .nav-dropdown a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: left;
            padding: 15px 26px;
            transition: background 0.3s;
        }
        .nav-dropdown a:hover,
        .nav-dropdown a:focus-visible {
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .nav-toggle,
            .nav-caret,
            .nav-dropdown a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu">
        <button class="nav-toggle" aria-expanded="false" aria-haspopup="true">
            Menu <span class="nav-caret" aria-hidden="true">&#9662;</span>
        </button>
        <div class="nav-dropdown">
            <a href="./">Home</a>
            <a href="programs/">Programs</a>
            <a href="portfolio/">Portfolio</a>
        </div>
    </nav>
    <h1>
        <br>HUHUDADA<br /></h1>
    <div class="background">Ty</div>
    <h2>
        Welcome
    </h2>

    <script>
        const background = document.querySelector(".background")

        document.addEventListener('scroll', () => {
            // Safari reports fractional scrollY on trackpad/Retina scrolling. A fractional
            // offset shifts the text layer a sub-pixel off the background and shows a faint
            // "Ty" ghost near the top. Rounding to whole pixels keeps the two copies aligned.
            const offset = Math.round(window.scrollY)

            background.style.backgroundPosition = `calc(50% + ${offset}px) calc(50% + ${offset}px)`
        })

        const navToggle = document.querySelector(".nav-toggle")
        const navMenu = document.querySelector(".nav-menu")
        const navDropdown = document.querySelector(".nav-dropdown")

        navToggle.addEventListener("click", (e) => {
            e.stopPropagation()
            const isOpen = navDropdown.classList.toggle("open")
            navToggle.setAttribute("aria-expanded", isOpen)
        })

        document.addEventListener("click", (e) => {
            if (!navMenu.contains(e.target)) {
                navDropdown.classList.remove("open")
                navToggle.setAttribute("aria-expanded", "false")
            }
        })

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                navDropdown.classList.remove("open")
                navToggle.setAttribute("aria-expanded", "false")
            }
        })
    </script>
</body>
</html>
