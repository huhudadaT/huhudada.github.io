<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Ty Zhang</title>
<meta name="description" content="Study flashcard decks in the browser. Import a set from the Library or write one by hand. Decks stay on your device.">
<link rel="icon" type="image/png" href="../../favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
  }
}
</script>

<style>
/* ══ palette ══════════════════════════════════════════════════════
   Site tokens unchanged. --rose-mid is the app's fill colour: a step
   between --rose and --rose-deep, light enough for large panels while
   small text keeps --rose-deep's contrast.                           */
:root {
    --sky-deep:   #15669d;
    --sky:        #3a8ab8;
    --sky-soft:   #94c6c3;
    --cream:      #f5ead8;
    --paper:      #fbf6ec;
    --paper-soft: #f0e4d1;
    --rose:       #cb8f9b;
    --rose-mid:   #a55265;
    --rose-deep:  #8d3c4f;
    --ink:        #1e2a3a;
    --ink-dim:    #5a6477;
    --ink-faint:  #a0a8b5;
    --line:       #e5d9c3;

    --rose-mid-hi: #9a4a5c;
    --shadow-near: 0 2px 6px rgba(30, 42, 58, .07);
    --shadow-far:  0 16px 40px rgba(30, 42, 58, .12);

    /* one content column, used by the top bar and every view, so the
       back button, the title and the cards share a left edge */
    --gutter: 32px;
    --col: 1560px;
}

* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Inter', system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(178deg, var(--cream) 0%, var(--paper) 38%, var(--paper) 100%);
    -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: 'JetBrains Mono', monospace; font-size: .86em; color: var(--ink-dim); }
.mono { font-family: 'JetBrains Mono', monospace; }
[hidden] { display: none !important; }
*:focus-visible { outline: 2px solid var(--rose-mid); outline-offset: 2px; }

/* ── square controls, matching the rest of the site ──────────────── */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); background: var(--paper); border-radius: 0;
    padding: 11px 18px; font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: background .16s, border-color .16s, color .16s;
}
.btn:hover { border-color: var(--rose-mid); color: var(--rose-deep); }
.btn-fill { background: var(--rose-mid); border-color: var(--rose-mid); color: var(--paper); font-weight: 600; }
.btn-fill:hover { background: var(--rose-mid-hi); border-color: var(--rose-mid-hi); color: var(--paper); }
.btn-quiet { border-color: transparent; background: none; color: var(--ink-dim); }
.btn-quiet:hover { border-color: var(--line); background: var(--paper); }
.btn-tiny { padding: 6px 11px; font-size: 11px; }
.btn.on { border-color: var(--rose-mid); color: var(--rose-deep); }
/* matches the corner control on every other page of the site */
.btn-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400;
    line-height: 1.6;                       /* the reference pill inherits 1.6 */
    letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim);
    padding: 9px 16px; background: rgba(251, 246, 236, .7);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.btn-pill:hover { color: var(--rose-deep); border-color: var(--rose-deep); }
.btn.danger:hover { border-color: var(--rose-deep); color: var(--rose-deep); background: rgba(141,60,79,.06); }
button:disabled { opacity: .34; pointer-events: none; }
kbd { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-faint); }
.btn-fill kbd { color: rgba(251,246,236,.72); }

.chip {
    display: inline-block; padding: 4px 10px; border: 1px solid rgba(58,138,184,.28);
    font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    background: rgba(58,138,184,.09); color: var(--sky-deep);
}
.chip + .chip { margin-left: 6px; }
.chip-soft { background: var(--paper-soft); border-color: var(--line); color: var(--ink-dim); }

.field { display: flex; flex-direction: column; gap: 7px; }
.field > span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
input[type=text], textarea, select {
    background: var(--paper); border: 1px solid var(--line); border-radius: 0;
    padding: 11px 13px; font-size: 15px; font-weight: 400;
}
textarea { resize: vertical; line-height: 1.6; min-height: 64px; font-size: 14px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: var(--rose-mid); }

/* ── chrome ──────────────────────────────────────────────────────── */
.topline { position: fixed; inset: 0 0 auto; height: 3px; background: var(--paper-soft); z-index: 60; }
.topline span { display: block; height: 3px; width: 0; background: var(--rose-mid); transition: width .25s ease; }
.bar { position: sticky; top: 0; z-index: 50; background: linear-gradient(var(--cream) 55%, rgba(245,234,216,0)); padding: 24px 0 16px; }
.bar-inner {
    max-width: var(--col); margin: 0 auto; padding: 0 var(--gutter);
    display: flex; align-items: center; gap: 16px;
}
.bar-mid {
    flex: 1; min-width: 0; font-size: 13px; color: var(--ink-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.page { max-width: var(--col); margin: 0 auto; padding: 8px var(--gutter) 90px; }
.none { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-dim); padding: 40px 0; }

/* ── page heads ──────────────────────────────────────────────────── */
.head-row {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    flex-wrap: wrap; padding: 4px 0 34px;
}
.brand-kicker {
    display: flex; align-items: center; gap: 11px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--rose-deep);
}
.brand-kicker::before { content: ''; width: 28px; height: 1px; background: var(--rose-deep); }
.brand-title {
    font-size: clamp(36px, 5.2vw, 54px); font-weight: 700;
    letter-spacing: -.035em; line-height: 1; margin: 13px 0 0;
}
.brand-title em { font-style: normal; color: var(--rose-mid); }
.head-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { width: clamp(180px, 26vw, 320px); }
.head-tools select { padding: 11px 12px; font-size: 13px; max-width: 190px; }

.view-title { font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin: 10px 0 6px; }
h2.sect-sm { font-size: 17px; font-weight: 600; margin: 32px 0 4px; }
.sect-note { font-size: 14px; font-weight: 400; color: var(--ink-dim); margin: 0 0 20px; }

/* ── stat line: every figure on one row ──────────────────────────── */
.statline {
    display: flex; gap: 0; flex-wrap: nowrap; overflow-x: auto;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 4px 0 24px;
}
.statline.center { justify-content: flex-start; margin: 26px 0; }
.statline span {
    display: flex; flex-direction: column; gap: 5px; padding: 16px 26px;
    border-right: 1px solid var(--line); white-space: nowrap;
}
.statline span:last-child { border-right: none; }
.statline b { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 400; }
.statline em {
    font-style: normal; font-size: 9px; font-weight: 600; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-faint);
}

/* ══ SHELF ════════════════════════════════════════════════════════ */
.stacks { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px,1fr)); gap: 38px 26px; }
.stack { position: relative; padding-bottom: 14px; }
.layer {
    position: absolute; inset: 0; background: var(--paper-soft);
    border: 1px solid var(--line); box-shadow: var(--shadow-near); transition: transform .24s ease;
}
.stack .l1 { transform: translate(5px,6px) rotate(.8deg); }
.stack .l2 { transform: translate(10px,12px) rotate(1.7deg); }
.stack:hover .l1 { transform: translate(7px,9px) rotate(1.3deg); }
.stack:hover .l2 { transform: translate(14px,18px) rotate(2.6deg); }
.facecard {
    position: relative; background: var(--paper); border: 1px solid var(--line);
    box-shadow: var(--shadow-near); padding: 22px; min-height: 190px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
}
.stack:hover .facecard { transform: translateY(-5px); box-shadow: var(--shadow-far); border-color: var(--rose); }
/* the whole card is the study button; only Details sits above it */
.stack-hit { position: absolute; inset: 0; z-index: 1; border: none; background: none; padding: 0; }
.stack-body, .stack-foot { position: relative; z-index: 2; pointer-events: none; }
.stack-foot .btn { pointer-events: auto; }
.stack-title { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 13px 0 5px; }
.stack-desc {
    font-size: 13px; font-weight: 400; line-height: 1.55; color: var(--ink-dim); margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.stack-foot { display: flex; align-items: center; gap: 10px; min-width: 0; }
.stack-meta {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--ink-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stack-meta b { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 400; color: var(--rose-mid); }
.stack-meta i { font-style: normal; color: var(--line); }
.stack-foot .btn-tiny { flex: none; }

.empty { text-align: center; padding: 80px 20px; }
.empty strong { display: block; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.empty p { color: var(--ink-dim); margin: 0 0 22px; }

/* ══ DECK DETAIL ══════════════════════════════════════════════════ */
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; flex-wrap: wrap; padding: 8px 0 24px; }
.sheet-id { flex: 1 1 420px; min-width: 0; }
.sheet-name { font-size: clamp(26px,3.2vw,38px); font-weight: 700; letter-spacing: -.015em; line-height: 1.15; margin: 14px 0 8px; }
.sheet-desc { font-size: 16px; font-weight: 400; line-height: 1.6; color: var(--ink-dim); margin: 0; max-width: 68ch; }
.sheet-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }

.menu { position: relative; display: inline-flex; }
.caret { font-size: 10px; }
.menu-drop {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 30;
    display: flex; flex-direction: column; min-width: 176px;
    background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-far);
}
.menu-drop button {
    border: none; background: none; text-align: left; padding: 11px 15px; font-size: 13px;
    border-bottom: 1px solid var(--line);
}
.menu-drop button:last-child { border-bottom: none; }
.menu-drop button:hover { background: var(--paper-soft); color: var(--rose-deep); }
.menu-drop button.danger:hover { color: var(--rose-deep); background: rgba(141,60,79,.08); }

.opt-row { display: flex; align-items: center; gap: 16px; border: 1px solid var(--line); background: var(--paper); padding: 15px 18px; }
.row-txt b { display: block; font-size: 14px; font-weight: 600; }
.row-txt span { font-size: 13px; font-weight: 400; color: var(--ink-dim); }

.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 10px; }
.slip {
    display: grid; grid-template-columns: 30px 1fr; gap: 4px 12px; text-align: left;
    border: 1px solid var(--line); background: var(--paper); border-radius: 0; padding: 13px 15px;
    transition: border-color .16s, background .16s;
}
.slip:hover { border-color: var(--rose-mid); background: var(--paper-soft); }
.slip-n { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faint); padding-top: 2px; }
.slip-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slip-q { font-size: 14px; font-weight: 500; line-height: 1.4; }
.slip-a { font-size: 13px; font-weight: 400; color: var(--ink-dim); line-height: 1.4; }
.slip-meta {
    grid-column: 2; display: flex; align-items: center; gap: 7px; margin-top: 6px;
    font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint);
}
.pip { width: 9px; height: 9px; display: inline-block; flex: none; }
.pip-unseen  { background: var(--paper-soft); box-shadow: inset 0 0 0 1px var(--line); }
.pip-shaky   { background: var(--sky); }
.pip-getting { background: var(--rose); }
.pip-solid   { background: var(--rose-deep); }
/* blue for the cards still to learn, deep rose for the ones that stuck */
.slip-meta.m-shaky { color: var(--sky-deep); }
.slip-meta.m-solid { color: var(--rose-deep); }

/* ══ STUDY ════════════════════════════════════════════════════════ */
.study { display: flex; flex-direction: column; align-items: center; }
.study-head { width: 100%; max-width: 1240px; padding: 2px 0 18px; }
.study-title { font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; letter-spacing: -.015em; line-height: 1.2; margin: 0 0 5px; }
.study-sub { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

/* arrows flank the card; they are quiet on purpose so the rating row
   below stays the obvious way forward */
.table {
    display: grid; grid-template-columns: 54px minmax(0,1fr) 54px; gap: 18px;
    align-items: center; width: min(1240px, 100%);
}
.side-arrow {
    width: 54px; height: 84px; border: 1px solid var(--line); background: rgba(251,246,236,.6);
    border-radius: 0; font-size: 26px; line-height: 1; color: var(--ink-faint);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .16s, border-color .16s, background .16s;
}
.side-arrow:hover:not(:disabled) { color: var(--rose-deep); border-color: var(--rose); background: var(--paper); }
.deck-space { perspective: 2200px; width: 100%; }
.flip { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.1,.2,1); }
.flip.turned { transform: rotateY(180deg); }
.side {
    position: absolute; inset: 0; padding: 56px 60px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    box-shadow: var(--shadow-far);
}
.side-q { position: relative; background: var(--paper); border: 1px solid var(--line); min-height: min(58vh, 520px); }
.side-a { background: var(--rose-mid); border: 1px solid var(--rose-mid); color: var(--paper); transform: rotateY(180deg); }
.side-tag {
    position: absolute; top: 20px; left: 24px;
    font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
}
.side-a .side-tag { color: rgba(251,246,236,.72); }
.card-text {
    font-size: clamp(28px, 3.1vw, 46px); font-weight: 500; line-height: 1.3; letter-spacing: -.015em;
    margin: 0; max-width: 34ch;
}
.tap {
    position: absolute; bottom: 20px; left: 0; right: 0;
    font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
}

.nav-row { display: flex; align-items: center; justify-content: center; margin-top: 18px; }
.nav-count {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
}
.jump {
    width: 62px; text-align: center; padding: 10px 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--rose-deep);
    background: var(--paper); border: 1px solid var(--line); border-radius: 0;
}

.rate-block { width: min(940px, 100%); margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.rate-label {
    text-align: center; margin-bottom: 12px;
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
}
.rate-block.live .rate-label { color: var(--rose-deep); }
.rate { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.rate .btn {
    flex: 1 1 0; min-width: 148px; padding: 19px 18px;
    font-size: 15px; font-weight: 600; border-top-width: 3px;
    box-shadow: var(--shadow-near);
}
.rate .r0 { border-top-color: var(--sky-deep); }
.rate .r1 { border-top-color: var(--sky); }
.rate .r2 { border-top-color: var(--rose); }
.rate .r3 { border-top-color: var(--rose-deep); }
.rate .btn:hover { box-shadow: var(--shadow-far); }
.rate-block:not(.live) .rate { opacity: .3; pointer-events: none; }

.dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 24px; max-width: 720px; }
.dot { width: 8px; height: 8px; border: none; background: var(--line); padding: 0; }
.dot.done { background: var(--rose-deep); }
.dot.miss { background: var(--sky); }
.dot.now { background: var(--rose-mid); outline: 1px solid var(--rose-mid); outline-offset: 2px; }
.study-foot { display: flex; justify-content: center; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

/* ══ RESULTS ══════════════════════════════════════════════════════ */
.res-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 900px; margin: 18px 0 22px; }
.res-fig { border: 1px solid var(--line); background: var(--paper); padding: 24px 26px; }
.res-fig b { display: block; font-size: 12px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-dim); margin-top: 6px; }
.res-fig em { display: block; font-style: normal; font-size: 13px; color: var(--ink-faint); margin-top: 8px; }
.score { font-family: 'JetBrains Mono', monospace; font-size: clamp(48px,6vw,78px); line-height: 1; color: var(--rose-mid); margin: 0; }
.score.alt { color: var(--sky-deep); }
.score-note { font-size: 14px; color: var(--ink-dim); margin: 0; }
.breakdown { display: grid; gap: 10px; max-width: 900px; margin: 22px 0 0; }
.bd-off { background: var(--paper-soft); }
.bd-off strong { color: var(--ink-faint); }
.bd { border: 1px solid var(--line); background: var(--paper); padding: 16px 10px; text-align: center; }
.bd strong { display: block; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 400; }
.bd span { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

/* ══ NEW DECK / EDITOR / IMPORT ═══════════════════════════════════ */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 18px 0 24px; }
.tab {
    border: none; background: none; padding: 12px 20px; font-size: 14px; font-weight: 500;
    color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--rose-deep); }
.tab.on { color: var(--rose-deep); border-bottom-color: var(--rose-mid); font-weight: 600; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; max-width: 980px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.actions.tight { margin: 0 0 20px; }
.card-edit { border: 1px solid var(--line); background: var(--paper); padding: 14px; margin-bottom: 10px; max-width: 980px; }
.card-edit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-edit-n { font-size: 11px; color: var(--ink-faint); }
.card-edit-tools { margin-left: auto; display: flex; gap: 4px; }
.icon {
    width: 30px; height: 30px; border: 1px solid var(--line); background: var(--paper); border-radius: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-dim);
}
.icon:hover { border-color: var(--rose-mid); color: var(--rose-deep); }
.card-edit .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.import-box { min-height: 260px; font-size: 12px; max-width: 980px; }
.field { max-width: 980px; }
.parse-note {
    border-left: 3px solid var(--rose-mid); background: var(--paper-soft);
    padding: 12px 16px; font-size: 13px; margin: 14px 0 20px; max-width: 980px;
}
.parse-note b { font-weight: 600; }
.parse-note div { margin-top: 4px; color: var(--ink-dim); }
.ai-panel {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    border: 1px solid var(--line); background: var(--paper-soft); padding: 16px 18px; max-width: 980px;
}
.ai-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-acts .btn[aria-expanded="true"] .caret { display: inline-block; transform: rotate(180deg); }
.ai-text {
    max-width: 980px; margin: -1px 0 0; padding: 20px 22px;
    border: 1px solid var(--line); border-top: none; background: var(--paper);
