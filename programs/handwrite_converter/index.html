<html lang="en">

        "imports": {

    <style>
    /* ---------------------------------------------- palette (DESIGN_GUIDE §2) */
    :root {
        --sky-deep:   #15669d;
        --sky:        #3a8ab8;
        --sky-soft:   #94c6c3;
        --cream:      #f5ead8;
        --paper:      #fbf6ec;
        --paper-soft: #f0e4d1;
        --rose:       #cb8f9b;
        --rose-deep:  #8d3c4f;
        --ink:        #1e2a3a;
        --ink-dim:    #5a6477;
        --ink-faint:  #a0a8b5;
        --line:       #e5d9c3;

        /* state tokens — keep identical to Cardly / Quizzical */
        --good:       #3f7a5e;
        --warn:       #a8762a;
        --bad:        #a33a34;
    }

    /* ------------------------------------------------------- reset (§4) + wash (§6) */
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background:
            radial-gradient(ellipse 85% 55% at 50% -12%, rgba(58, 138, 184, 0.10), transparent 62%),
            radial-gradient(ellipse 95% 55% at 50% 112%, rgba(139, 60, 79, 0.08), transparent 62%),
            var(--paper);
        background-attachment: fixed;
        color: var(--ink);
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 300;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
        outline: 2px solid var(--rose-deep);
        outline-offset: 2px;
    }

    /* --------------------------------------------------- corner nav pills (§7.1) */
    .pill {
        position: fixed; top: 24px; z-index: 10;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
        color: var(--ink-dim);
        padding: 9px 16px;
        border: 1px solid var(--line);
        background: rgba(251, 246, 236, 0.7);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        transition: color 0.3s, border-color 0.3s;
    }
    .pill:hover { color: var(--rose-deep); border-color: var(--rose-deep); }
    .pill-left  { left: 32px; }
    .pill-right { right: 32px; }

    /* ------------------------------------------------------------ layout (§5) */
    .wrap { max-width: 1560px; margin: 0 auto; padding: 0 32px; }

    .page-head { padding: 100px 0 28px; border-bottom: 1px solid var(--line); }
    .project-kicker {
        display: flex; align-items: center; gap: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
        color: var(--rose-deep); margin-bottom: 24px;
    }
    .project-kicker::before { content: ''; width: 32px; height: 1px; background: var(--rose-deep); }
    h1 {
        font-family: 'Cormorant Garamond', serif; font-weight: 400;
        font-size: clamp(40px, 5.5vw, 72px); line-height: 1.05; letter-spacing: -0.015em;
        color: var(--ink); margin: 0; max-width: 22ch;
    }
    .lede {
        font-family: 'Inter', sans-serif; font-weight: 400;
        font-size: clamp(1rem, 2.4vw, 1.2rem); line-height: 1.65;
        color: var(--ink-dim); max-width: 52ch; margin: 20px 0 0;
    }

    footer {
        padding: 24px; text-align: center;
        border-top: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
        color: var(--ink-faint);
    }

    /* ------------------------------------------------------------- tool shell */
    .ht-grid {
        display: grid; grid-template-columns: 300px minmax(0, 1fr);
        gap: 32px; align-items: start;
        padding: 32px 0 72px;
    }
    .ht-icon { flex: 0 0 auto; }

    .ht-label {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
        color: var(--ink-dim); margin: 28px 0 10px;
    }

    /* drop target */
    .ht-drop {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        width: 100%; padding: 28px 16px;
        background: var(--paper-soft);
        border: 1px dashed var(--ink-faint);
        color: var(--ink); cursor: pointer;
        font: inherit;
        transition: border-color 0.3s, color 0.3s;
    }
    .ht-drop:hover,
    .ht-drop[data-live="true"] { border-color: var(--rose-deep); color: var(--rose-deep); }
    .ht-drop-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; line-height: 1; }
    .ht-drop-note {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim);
    }

    /* output modes */
    .ht-modes { border: 1px solid var(--line); }
    .ht-mode {
        display: block; width: 100%; text-align: left;
        padding: 12px 14px; font: inherit; color: var(--ink);
        background: transparent; border: 0;
        border-bottom: 1px solid var(--line);
        border-left: 2px solid transparent;
        cursor: pointer; transition: background 0.3s;
    }
    .ht-mode:last-child { border-bottom: 0; }
    .ht-mode:hover { background: var(--paper-soft); }
    .ht-mode[data-on="true"] { background: var(--paper-soft); border-left-color: var(--rose-deep); }
    .ht-mode-name { display: block; font-size: 14px; font-weight: 400; }
    .ht-mode[data-on="true"] .ht-mode-name { color: var(--rose-deep); }
    .ht-mode-hint { display: block; font-size: 12px; line-height: 1.5; color: var(--ink-dim); margin-top: 3px; }

    /* primary action */
    .ht-run {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; margin-top: 16px; padding: 13px 16px;
        background: transparent;
        border: 1px solid var(--rose-deep); color: var(--rose-deep);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
        cursor: pointer; transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .ht-run:hover:not(:disabled) { background: var(--rose-deep); color: var(--paper); }
    .ht-run:disabled { border-color: var(--line); color: var(--ink-faint); cursor: not-allowed; }

    /* page queue */
    .ht-pages { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); }
    .ht-page {
        display: flex; align-items: stretch;
        border-bottom: 1px solid var(--line);
        border-left: 2px solid transparent;
    }
    .ht-page:last-child { border-bottom: 0; }
    .ht-page[data-on="true"] { background: var(--paper-soft); border-left-color: var(--rose-deep); }
    .ht-page-pick {
        display: flex; align-items: center; gap: 10px;
        flex: 1; min-width: 0; padding: 8px 10px;
        background: none; border: 0; text-align: left;
        font: inherit; color: inherit; cursor: pointer;
    }
    .ht-thumb {
        width: 34px; height: 34px; flex: 0 0 auto;
        object-fit: cover; background: var(--paper-soft); border: 1px solid var(--line);
    }
    .ht-thumb-pdf {
        display: grid; place-items: center;
        font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1px;
        color: var(--ink-dim);
    }
    .ht-page-text { min-width: 0; flex: 1; }
    .ht-page-name {
        display: block; font-size: 13px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ht-page-state {
        display: block; margin-top: 2px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
        color: var(--ink-faint);
    }
    .ht-page-state[data-s="done"]    { color: var(--good); }
    .ht-page-state[data-s="reading"] { color: var(--warn); }
    .ht-page-state[data-s="failed"]  { color: var(--bad); }
    .ht-page-del {
        background: none; border: 0; padding: 0 12px;
        color: var(--ink-faint); cursor: pointer; transition: color 0.3s;
    }
    .ht-page-del:hover { color: var(--bad); }

    /* api key */
    .ht-key { display: flex; }
    .ht-input {
        flex: 1; min-width: 0; padding: 9px 10px;
        background: var(--paper); border: 1px solid var(--line);
        color: var(--ink);
        font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
    }
    .ht-input::placeholder { color: var(--ink-faint); letter-spacing: 1px; }
    .ht-key .ht-btn { border-left: 0; flex: 0 0 auto; }
    .ht-key-note {
        font-size: 11.5px; line-height: 1.55; color: var(--ink-dim); margin: 10px 0 0;
    }
    .ht-link {
        background: none; border: 0; padding: 0;
        font: inherit; color: var(--rose-deep);
        border-bottom: 1px solid var(--rose-deep); cursor: pointer;
    }

    /* notices */
    .ht-notice {
        display: flex; align-items: flex-start; gap: 10px;
        margin-top: 18px; padding: 11px 12px;
        border: 1px solid var(--bad);
        background: var(--paper-soft);
        background: color-mix(in srgb, var(--bad) 7%, var(--paper));
        color: var(--bad); font-size: 12.5px; line-height: 1.5;
    }
    .ht-fail {
        padding: 28px clamp(20px, 4vw, 40px);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px; line-height: 1.8; color: var(--bad);
    }

    /* ------------------------------------------------------------ result panel */
    .ht-panel {
        display: flex; flex-direction: column; min-height: 480px;
        background: rgba(255, 255, 255, 0.35);
        border: 1px solid var(--line);
    }
    .ht-bar {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding: 10px 14px; border-bottom: 1px solid var(--line);
    }
    .ht-bar-name {
        flex: 1 1 120px; min-width: 0; margin-right: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ht-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 10px;
        background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
        cursor: pointer; transition: color 0.3s, border-color 0.3s;
    }
    .ht-btn:hover:not(:disabled) { color: var(--rose-deep); border-color: var(--rose-deep); }
    .ht-btn:disabled { color: var(--ink-faint); cursor: not-allowed; }

    .ht-seg { display: inline-flex; border: 1px solid var(--line); }
    .ht-seg-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 10px;
        background: transparent; border: 0; border-right: 1px solid var(--line);
        color: var(--ink-dim);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
        cursor: pointer; transition: color 0.3s, background 0.3s;
    }
    .ht-seg-btn:last-child { border-right: 0; }
    .ht-seg-btn:hover { color: var(--rose-deep); }
    .ht-seg-btn[data-on="true"] { color: var(--rose-deep); background: var(--paper-soft); }

    /* states */
    .ht-empty { flex: 1; display: grid; place-items: center; padding: 64px 24px; text-align: center; }
    .ht-empty p { max-width: 38ch; margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink-dim); }

    .ht-reading { display: flex; align-items: center; gap: 16px; padding: 32px clamp(20px, 4vw, 40px); }
    .ht-reading-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--warn);
    }
    .ht-track { position: relative; flex: 1; height: 1px; background: var(--line); overflow: hidden; }
    .ht-track::after {
        content: ''; position: absolute; top: 0; left: 0; height: 1px; width: 35%;
        background: var(--rose-deep);
        animation: ht-sweep 1.6s ease-in-out infinite;
    }
    @keyframes ht-sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

    /* ------------------------------------------------------ transcript: formatted */
    .ht-doc {
        flex: 1; padding: 40px clamp(20px, 4vw, 56px) 48px;
        background: rgba(255, 255, 255, 0.55);
        font-size: 17px; line-height: 1.75; color: var(--ink);
    }
    .ht-doc > * { max-width: 62ch; }
    .ht-doc > .ht-table, .ht-doc > .ht-mathblock { max-width: 100%; }
    .ht-doc > *:first-child { margin-top: 0; }
    .ht-h {
        font-family: 'Cormorant Garamond', serif; font-weight: 400;
        line-height: 1.15; letter-spacing: -0.01em; margin: 32px 0 14px;
    }
    .ht-h1 { font-size: 34px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .ht-h2 { font-size: 27px; }
    .ht-h3 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--rose-deep);
        margin: 30px 0 12px;
    }
    .ht-h4 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim);
        margin: 26px 0 10px;
    }
    .ht-p { margin: 0 0 16px; }
    .ht-list { list-style: none; margin: 0 0 16px; padding: 0; }
    .ht-li { display: flex; gap: 12px; margin-bottom: 6px; }
    .ht-marker {
        flex: 0 0 auto; min-width: 1.2em;
        font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--rose-deep);
    }
    .ht-quote {
        margin: 0 0 20px; padding: 20px 24px;
        background: var(--paper-soft); border-left: 2px solid var(--rose-deep);
        font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400;
        font-size: 22px; line-height: 1.5; color: var(--ink); white-space: pre-wrap;
    }
    .ht-hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    .ht-table { border-collapse: collapse; width: 100%; margin: 4px 0 20px; font-size: 15px; }
    .ht-table th, .ht-table td {
        border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top;
    }
    .ht-table th {
        background: var(--paper-soft); font-weight: 400; color: var(--ink-dim);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    }
    .ht-code {
        font-family: 'JetBrains Mono', monospace; font-size: 0.85em;
        background: var(--paper-soft); border: 1px solid var(--line); padding: 1px 4px;
    }
    .ht-note {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
        color: var(--rose-deep); background: var(--paper); border: 1px solid var(--line);
        padding: 2px 6px;
    }

    /* maths */
    .ht-math, .ht-mathblock { font-variant-numeric: lining-nums; }
    .ht-math { white-space: nowrap; }
    .ht-mathblock {
        display: block; text-align: center; font-size: 19px;
        margin: 20px 0 22px; padding: 14px 8px;
        border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
        overflow-x: auto;
    }
    .ht-math sub, .ht-math sup, .ht-mathblock sub, .ht-mathblock sup { font-size: 0.68em; line-height: 0; }
    .ht-frac {
        display: inline-flex; flex-direction: column; vertical-align: middle;
        text-align: center; margin: 0 0.18em; line-height: 1.16; font-size: 0.94em;
    }
    .ht-num { border-bottom: 1px solid currentColor; padding: 0 0.28em; }
    .ht-den { padding: 0 0.28em; }
    .ht-sqrt::before { content: "√"; }
    .ht-sqrt-body { border-top: 1px solid currentColor; padding: 0 0.12em; }
    .ht-tex-up { font-style: normal; }
    .ht-tex-bf { font-weight: 500; }

    /* ---------------------------------------------- transcript: source and edit */
    .ht-source, .ht-edit {
        flex: 1; padding: 28px clamp(20px, 4vw, 40px);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px; line-height: 2; color: var(--ink);
        white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    }
    .ht-source { background: var(--paper-soft); }
    .ht-edit {
        width: 100%; min-height: 400px; resize: vertical;
        background: rgba(255, 255, 255, 0.55); border: 0;
    }

    .ht-flag {
        background: var(--paper-soft);
        background: color-mix(in srgb, var(--warn) 18%, var(--paper));
        color: var(--ink);
        box-shadow: inset 0 -1px 0 var(--warn);
        padding: 0 2px;
    }

    .ht-foot {
        display: flex; gap: 20px; flex-wrap: wrap;
        padding: 10px 14px; border-top: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim);
    }
    .ht-foot-flag { color: var(--warn); }

    /* ------------------------------------------------------------- breakpoints */
    @media (max-width: 900px) {
        .wrap { padding: 0 20px; }
        .page-head { padding: 88px 0 24px; }
        .ht-grid { grid-template-columns: 1fr; gap: 24px; padding: 24px 0 56px; }
        .ht-panel { min-height: 0; }
    }
    @media (max-width: 520px) {
        .pill-left { left: 16px; }
        .pill-right { right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .pill, .ht-drop, .ht-mode, .ht-run, .ht-btn, .ht-seg-btn,
        .ht-page-del, .ht-link { transition: none; }
        .ht-track::after { animation: none; width: 100%; opacity: 0.4; }
    }
    </style>
</head>

import React, { useState, useRef, useCallback, useEffect } from "react";

/* ------------------------------------------------------------------ config */
// Real API call, not the Claude.ai artifact proxy. Swap the model here.
const MODEL = "claude-sonnet-5";
const MAX_TOKENS = 8000;
const KEY_STORE = "longhand:key";
const MODES = {
    markdown: {
        label: "Structured",
        hint: "Headings, lists, tables. Equations and chemistry as LaTeX.",
        rule: `Return Markdown. Use headings, lists and tables where the page uses them. Set every equation, formula or chemical expression in LaTeX: $...$ inline, $$...$$ on its own line. Arrows drawn between terms become \\rightarrow or \\rightleftharpoons as appropriate. Sub- and superscripts must be exact.`,
    },
    layout: {
        label: "Layout",
        hint: "Line breaks, indents and columns kept as drawn.",
        rule: `Keep the physical layout. One line of writing is one line of output. Preserve indentation with spaces, keep columns side by side where the page has them, and transcribe bullets, arrows, boxes and underlines using plain characters. No Markdown formatting.`,
    },
    plain: {
        label: "Plain prose",
        hint: "Reading order, no formatting.",
        rule: `Return plain running text in natural reading order. Join lines that belong to the same sentence. No Markdown, no layout preservation.`,
    },
};
const SYSTEM = `You transcribe handwriting from images and scans.

Output only the transcription. No preamble, no summary, no commentary, no code fences.

Non-negotiable rules:
- Transcribe what is on the page. Never correct spelling, grammar, arithmetic or terminology, and never add content that is not written.
- If a word is legible but you are less than confident, wrap it in ⟦guess⟧. Use the flag sparingly, only where a reader would want to check.
- If something is genuinely unreadable, write ⟦?⟧ in its place.
- Crossed-out text is omitted unless it is the only reading available.
- Text in margins, in boxes, or written sideways belongs in the transcription. Put it where it makes sense and label it, e.g. [margin] or [box].
- Sketches and diagrams are described in one short line inside square brackets, e.g. [diagram: hepatic lobule, portal triad labelled].
- If the page contains no handwriting at all, output exactly: ⟦?⟧ no handwriting found.`;
const ACCEPT = "image/png,image/jpeg,image/webp,image/gif,application/pdf";
const OK_TYPES = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "image/gif",
    "application/pdf",
];
let seq = 0;
/* ------------------------------------------------------------------- icons */
// Inline so the page pulls no icon library. 24-grid, 1.6 stroke, currentColor.
const PATHS = {
    upload: ["M12 15V3", "M7 8l5-5 5 5", "M4 16v4h16v-4"],
    copy: ["M9 8h11v13H9z", "M4 16V3h11"],
    download: ["M12 3v12", "M7 10l5 5 5-5", "M4 20h16"],
    trash: ["M4 7h16", "M9 7V4h6v3", "M6 7l1 13h10l1-13"],
    alert: ["M12 3 21 20H3z", "M12 9v5", "M12 17h.01"],
    check: ["M4 12l5 5L20 6"],
    pencil: ["M4 20h4L20 8l-4-4L4 16z", "M14 6l4 4"],
    book: ["M12 7v14", "M12 7C10 5 7 5 3 5v14c4 0 7 0 9 2", "M12 7c2-2 5-2 9-2v14c-4 0-7 0-9 2"],
    source: ["M15 3H6v18h12V8z", "M15 3v5h4", "M10 13l-2 2 2 2", "M14 13l2 2-2 2"],
    again: ["M3 12a9 9 0 1 0 3-6.8", "M3 4v5h5"],
    play: ["M7 4l13 8-13 8z"],
};
